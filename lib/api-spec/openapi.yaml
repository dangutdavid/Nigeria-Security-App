      properties:
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
        recipientUserId:
          type: string
        recipientAgency:
          $ref: "#/components/schemas/AgencyType"
        reportReference:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required: [type, title, body]
    Agency:
