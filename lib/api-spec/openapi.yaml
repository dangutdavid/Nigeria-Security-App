        shortName:
          type: string
        fullName:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        badgePrefix:
          type: string
        description:
          type: string
        icon:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, shortName, fullName, primaryColor, secondaryColor, badgePrefix, description, isActive]
    AgencyCreateRequest:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgencyType"
        name:
          type: string
        shortName:
          type: string
        fullName:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        badgePrefix:
          type: string
        description:
          type: string
        icon:
          type: string
