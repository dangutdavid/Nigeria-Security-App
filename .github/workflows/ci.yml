name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Lint (typescript-eslint + eslint-plugin-security)
        run: pnpm run lint

      - name: API server tests
        run: pnpm --filter @workspace/api-server test

      - name: Mobile tests
        run: pnpm --filter @workspace/mobile test

      - name: OpenAPI codegen drift
        run: |
          pnpm --filter @workspace/api-spec run codegen
          if [ -n "$(git status --porcelain lib/)" ]; then
            echo "::error::Generated client/zod is out of sync with openapi.yaml. Run 'pnpm --filter @workspace/api-spec run codegen' and commit the result."
            git status --porcelain lib/
            git diff -- lib/
            exit 1
          fi

      - name: Dependency audit (production, high severity)
        run: pnpm run audit:prod

      - name: Diff hygiene
        run: git diff --check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nigeria_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations against fresh Postgres
        run: pnpm --filter @workspace/db run migrate
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/nigeria_security
